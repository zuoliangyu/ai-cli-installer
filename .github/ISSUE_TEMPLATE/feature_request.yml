name: 功能建议
description: 提议新功能或改进现有功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题 / 使用场景
      description: 目前哪里不方便？希望解决什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 希望应用怎样表现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 桌面端（Tauri）
        - Web 模式（installer-web）
        - 新增 / 支持其他 CLI 工具
        - 镜像与下载
        - 配置修复
        - 界面与交互
        - 其他
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考链接等
    validations:
      required: false
