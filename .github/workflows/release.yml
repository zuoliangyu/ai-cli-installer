name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g. v0.0.7). Required for manual run.'
        required: true

# Concurrency: only one release per tag in flight. `inputs.tag` is only set
# for manual runs; tag pushes fall back to the tag name.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# GITHUB_TOKEN needs explicit write permission for `gh release` to work.
permissions:
  contents: write

env:
  # Manual runs build the requested tag, not the branch they were started from.
  RELEASE_REF: ${{ inputs.tag || github.ref }}

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid tag: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify versions match tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          cargo_version() {
            sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' "$1" | head -1
          }
          fail=0
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error file=$1::version '$2' does not match tag $TAG"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }
          check src-tauri/tauri.conf.json "$(jq -r .version src-tauri/tauri.conf.json)"
          check package.json "$(jq -r .version package.json)"
          for manifest in src-tauri/Cargo.toml crates/installer-core/Cargo.toml crates/installer-web/Cargo.toml; do
            check "$manifest" "$(cargo_version "$manifest")"
          done
          exit "$fail"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          # Extract the section between "## [VERSION]" and the next "## "
          # (exclusive). Use string `index()` instead of regex — more portable
          # across awk implementations (gawk warns on \[ \] escapes).
          awk -v ver="$VERSION" '
            /^## / {
              if (capture) { exit }
              if (index($0, "## [" ver "]") > 0) { capture=1; next }
            }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          # Trim leading blank lines
          sed -i '/./,$!d' /tmp/release-notes.md
          # Fallback to generic note if extraction yielded nothing
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Automated build of $TAG. See CHANGELOG.md for details." > /tmp/release-notes.md
            echo "fallback used (no [$VERSION] section in CHANGELOG)"
          fi
          echo "--- release notes ---"
          cat /tmp/release-notes.md
          echo "---------------------"

      - name: Create draft release (if not exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --verify-tag \
              --draft
          else
            # Release already exists (re-run scenario) — refresh notes from CHANGELOG
            gh release edit "$TAG" \
              --repo "$REPO" \
              --notes-file /tmp/release-notes.md
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            tauri_args: ''
            rust_target: ''
          - name: windows-x86_64
            os: windows-latest
            tauri_args: ''
            rust_target: ''
          - name: macos-aarch64
            os: macos-latest
            tauri_args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
            # Both macOS builds emit `AI CLI Installer.app.tar.gz`; rename the
            # updater bundle per arch so the uploads don't clobber each other.
            updater_arch: aarch64
          - name: macos-x86_64
            os: macos-latest
            tauri_args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
            updater_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Workspace root holds Cargo.lock + the three members
          # (src-tauri, crates/installer-core, crates/installer-web).
          workspaces: .
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Build with tauri-action
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.tauri_args }}
          includeUpdaterJson: false
          # Don't let tauri-action create / upload to release; we manage it
          # ourselves so generate-latest can compose a merged latest.json.
          tagName: ''

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          UPDATER_ARCH: ${{ matrix.updater_arch }}
        shell: bash
        run: |
          VERSION="${TAG#v}"
          staging=$(mktemp -d)
          # Strip CR (Windows git-bash) and skip dirs (.app bundles).
          printf '%s' "$ARTIFACT_PATHS" | jq -r '.[]' | tr -d '\r' | while IFS= read -r f; do
            if [ -d "$f" ]; then
              echo "skip dir: $f"
              continue
            fi
            f="${f//\\//}"
            name=$(basename "$f")
            if [ -n "$UPDATER_ARCH" ]; then
              case "$name" in
                *.app.tar.gz|*.app.tar.gz.sig)
                  renamed="AI.CLI.Installer_${VERSION}_${UPDATER_ARCH}.app.tar.gz${name##*.app.tar.gz}"
                  cp "$f" "$staging/$renamed"
                  f="$staging/$renamed"
                  ;;
              esac
            fi
            echo "uploading: $f"
            gh release upload "$TAG" "$f" --repo "$REPO" --clobber
          done

  generate-latest:
    name: Generate latest.json
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          tmp=$(mktemp -d)
          cd "$tmp"

          # Missing signatures are reported per platform below.
          gh release download "$TAG" --repo "$REPO" -p '*.sig' || true
          ls -la
          gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' > assets.txt

          URL_BASE="https://github.com/$REPO/releases/download/$TAG"
          missing=0

          # Prints "<signature>\t<url>" for the single asset whose .sig matches
          # the glob; the URL comes from the real uploaded asset name, so it
          # can't drift from what tauri produced.
          platform() {
            local key="$1" pattern="$2" sig asset
            sig=$(ls $pattern 2>/dev/null | head -1)
            if [ -z "$sig" ] || [ ! -s "$sig" ]; then
              echo "::error::missing signature for $key ($pattern)" >&2
              missing=1
              return
            fi
            asset="${sig%.sig}"
            if ! grep -Fxq "$asset" assets.txt; then
              echo "::error::signature $sig has no matching asset $asset" >&2
              missing=1
              return
            fi
            jq -n --arg key "$key" --arg sig "$(cat "$sig")" --arg url "$URL_BASE/$asset" \
              '{($key): {signature: $sig, url: $url}}' > "platform-$key.json"
          }

          # Tauri v2 updater on Windows downloads NSIS installer directly,
          # verifies via .exe.sig — no .zip wrapper needed.
          platform windows-x86_64 "*_x64-setup.exe.sig"
          platform darwin-aarch64 "*_${VERSION}_aarch64.app.tar.gz.sig"
          platform darwin-x86_64 "*_${VERSION}_x64.app.tar.gz.sig"
          platform linux-x86_64 "*_amd64.AppImage.sig"

          if [ "$missing" -ne 0 ]; then
            echo "Refusing to publish latest.json with missing signatures"
            exit 1
          fi

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -s \
            --arg version "$VERSION" \
            --arg notes "Release v$VERSION" \
            --arg pub_date "$PUB_DATE" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: add}' \
            platform-*.json > latest.json

          echo "=== latest.json ==="
          cat latest.json

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

  publish:
    name: Publish release
    needs: [prepare, build, generate-latest]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as non-draft + latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG" \
            --repo "$REPO" \
            --draft=false \
            --latest
